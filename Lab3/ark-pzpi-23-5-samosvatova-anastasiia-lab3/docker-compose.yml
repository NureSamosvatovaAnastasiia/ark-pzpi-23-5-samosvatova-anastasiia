version: '3.8'

services:
  # База данных
  db:
    image: postgres:15-alpine
    container_name: agro_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: agro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d agro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Миграции (накатываем таблицы при старте)
  db_migrate:
    build: .
    container_name: db_migrate
    command: npm run db:push
    environment:
      DATABASE_URL: postgres://myuser:mypassword@db:5432/agro_db
    depends_on:
      db:
        condition: service_healthy

  # API Сервер
  api:
    build: .
    container_name: agro_api
    restart: always
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000" # <-- Важно: открываем порт для внешнего мира (и для второго проекта)
    environment:
      DATABASE_URL: postgres://myuser:mypassword@db:5432/agro_db
      PORT: 3000
      JWT_SECRET: super_secret_key_for_demo

volumes:
  postgres_data: